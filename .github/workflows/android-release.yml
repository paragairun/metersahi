name: Build Signed Release AAB

# Builds a release .aab, then signs it DIRECTLY with jarsigner.
#
# The alias is read directly out of the keystore file itself, not from
# a separate secret you have to type correctly. Your keystore only has
# one entry in it, so there's nothing to disambiguate.
#
# The store password is used for BOTH the keystore and the private key
# unlock - not a shortcut, but a correction. PKCS12 keystores (what
# keytool creates by default) don't actually support a distinct
# per-key password the way the older JKS format did; keytool silently
# accepts two different values at creation time, but only the store
# password ever really works. This was confirmed directly against the
# real keystore before being fixed here.
#
# No Play Console upload, no service account. Download the signed .aab
# from this run's Artifacts and upload it to Play Console yourself.
#
# Manual trigger only (workflow_dispatch).
#
# ─────────────────────────────────────────────────────────────────
# ONE-TIME SETUP - only 2 secrets needed:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
# (repo Settings -> Secrets and variables -> Actions)
#
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are no longer used at all
# - safe to delete those two secrets if you still have them set.
# ─────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (leave blank to auto-generate from the run number)"
        required: false
        type: string
      version_name:
        description: "versionName, e.g. 2.0.5 (leave blank to keep the build.gradle value)"
        required: false
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      # Lifts the auto-generated versionCode clear of codes already used by
      # earlier hand-edited builds. Raise this if Play ever reports a clash.
      VERSION_CODE_BASE: 100
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Verify keystore actually decoded to something real
        run: |
          FILESIZE=$(stat -c%s android/app/release.jks 2>/dev/null || stat -f%z android/app/release.jks)
          if [ "$FILESIZE" -lt 100 ]; then
            echo "::error::release.jks is suspiciously small ($FILESIZE bytes) - ANDROID_KEYSTORE_BASE64 is probably empty or wrong."
            exit 1
          fi
          echo "Keystore looks real ($FILESIZE bytes)."

      - name: Work out the version for this build
        id: version
        run: |
          set -euo pipefail

          # WHY THIS STEP EXISTS
          # build.gradle reads VERSION_CODE from the environment and falls back
          # to a hardcoded literal when it is absent. Nothing here ever set it,
          # so every single build shipped the same versionCode and the number
          # had to be edited by hand in build.gradle before each release.
          #
          # VERSION_CODE_BASE + run_number gives a value that always increases
          # and never repeats, because GitHub's run_number only ever counts up
          # for a given workflow. The base lifts it clear of the codes already
          # consumed by earlier manual builds.
          BASE=${VERSION_CODE_BASE}
          AUTO=$(( BASE + GITHUB_RUN_NUMBER ))
          CODE="${{ inputs.version_code }}"
          if [[ -z "${CODE}" ]]; then CODE="${AUTO}"; fi

          if ! [[ "${CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode '${CODE}' is not a positive integer"
            exit 1
          fi

          # The fallback literal in build.gradle records the highest code used
          # before CI took over. Anything at or below it would be rejected by
          # Play as already used.
          FALLBACK=$(grep -oP 'VERSION_CODE"\)\.toInteger\(\) : \K[0-9]+' android/app/build.gradle)
          if [[ "${CODE}" -le "${FALLBACK}" ]]; then
            echo "::error::versionCode ${CODE} is not greater than ${FALLBACK}, which has already been used. Raise VERSION_CODE_BASE or pass version_code manually."
            exit 1
          fi

          NAME="${{ inputs.version_name }}"
          if [[ -z "${NAME}" ]]; then
            NAME=$(grep -oP 'versionName System.getenv\("VERSION_NAME"\) \?: "\K[^"]+' android/app/build.gradle)
          fi

          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${CODE}  versionName=${NAME}"

      - name: Build release bundle (.aab) - unsigned at this point, signed in the next step
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign the .aab directly with jarsigner (alias auto-detected from the keystore)
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ -z "$STORE_PASS" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is empty. Check this secret in Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Read the real alias directly from the keystore, instead of
          # trusting a separately-typed secret to match it exactly.
          REAL_ALIAS=$(keytool -list -keystore android/app/release.jks -storepass "$STORE_PASS" 2>/dev/null | grep "PrivateKeyEntry" | cut -d, -f1)

          if [ -z "$REAL_ALIAS" ]; then
            echo "::error::Could not find any PrivateKeyEntry in the keystore at all. ANDROID_KEYSTORE_PASSWORD is probably wrong."
            exit 1
          fi

          echo "Signing with the keystore's own alias (auto-detected, not hardcoded)."

          # CONFIRMED ROOT CAUSE (found by testing directly against the
          # real keystore): PKCS12-format keystores - what keytool
          # creates by default - do not actually support a private-key
          # password distinct from the store password. keytool silently
          # accepts two different values at creation time, but only the
          # store password ever really unlocks the key. Using a
          # separate ANDROID_KEY_PASSWORD here (even though it was
          # correctly set) caused every single signing attempt to fail
          # with a confusing "not a private key" error. The store
          # password is deliberately used for BOTH arguments below -
          # this is correct, not a shortcut.
          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            "$AAB_PATH" \
            "$REAL_ALIAS"

      - name: Verify the .aab is ACTUALLY signed
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if ! jarsigner -verify "$AAB_PATH" > /tmp/jarsigner-output.txt 2>&1; then
            echo "::error::The .aab is still not signed. Something is genuinely wrong with the keystore or ANDROID_KEYSTORE_PASSWORD."
            cat /tmp/jarsigner-output.txt
            exit 1
          fi
          echo "Confirmed: .aab is genuinely signed."
          cat /tmp/jarsigner-output.txt

      - name: Clean up decoded keystore
        if: always()
        run: rm -f android/app/release.jks

      - name: Upload signed AAB as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: metersahi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

# ─────────────────────────────────────────────────────────────────
# TO ACTUALLY PUBLISH: download the .aab from this run's Artifacts
# section, then go to Play Console -> your app -> Testing (or
# Production) -> Create new release -> upload it there directly.
# ─────────────────────────────────────────────────────────────────
